name: Deploy from GHCR

on:
  workflow_run:
    workflows: ['Build and Push to GHCR']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.config.outputs.configured }}
    steps:
      - name: Check deployment configuration
        id: config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Server deployment skipped: DEPLOY_HOST, DEPLOY_USER, and DEPLOY_KEY are not configured.'
          fi

  deploy:
    needs: preflight
    if: >-
      needs.preflight.outputs.configured == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy client container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -euo pipefail

          APP_DIR=/opt/liuyao-app
          if [ -d "$APP_DIR/.git" ]; then
            cd "$APP_DIR"
            git checkout main
            git pull --ff-only origin main
          else
            mkdir -p "$APP_DIR"
            git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            cd "$APP_DIR"
          fi

          echo '${{ env.REGISTRY_PASSWORD }}' | docker login ghcr.io -u '${{ env.REGISTRY_USERNAME }}' --password-stdin
          export GHCR_REPO='${{ github.repository }}'
          export IMAGE_TAG=latest

          docker compose -f docker-compose.ghcr.yml pull client
          docker compose -f docker-compose.ghcr.yml up -d --remove-orphans client

          for attempt in $(seq 1 12); do
            status=$(docker inspect --format='{{.State.Health.Status}}' liuyao-client 2>/dev/null || true)
            if [ "$status" = healthy ]; then
              docker image prune -f
              docker logout ghcr.io
              exit 0
            fi
            sleep 5
          done

          docker compose -f docker-compose.ghcr.yml logs --tail=100 client
          exit 1
          EOF
